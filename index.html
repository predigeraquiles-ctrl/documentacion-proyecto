<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/png" href="../logoOficialPvP1.png">
    <title>Torneo Pokémon CESMI - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- MENÚ HAMBURGUESA / SIDEBAR -->
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir Menú">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../logoOficialPvP1.png" alt="Logo Torneo" class="sidebar-logo">
            <h2>TORNEO CESMI</h2>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-btn active" data-view="view-draw">🎰 Sorteo / Ruleta</button>
            <button class="nav-btn" data-view="view-arena">🌳 Árbol de Combatientes</button>
            <button class="nav-btn" data-view="view-reward">🏆 Recompensas</button>
        </nav>
    </aside>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-content">
        
        <!-- HEADER GLOBAL -->
        <header class="title-header">
            <div class="logo-container">
                <img src="../logoOficialPvP1.png" alt="Logo Torneo">
            </div>
            <h1>Torneo Pokémon CESMI</h1>
        </header>

        <!-- VISTA 1: SORTEO / RULETA -->
        <section id="view-draw" class="view-section active">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="320" height="320"></canvas>
            </div>
            <div class="controls">
                <button id="spinBtn">Girar Ruleta</button>
                <button id="startTournamentBtn" class="btn-gold" style="display: none;">¡Ir a la Arena de Combate!</button>
            </div>
        </section>

        <!-- VISTA 2: ARENA Y ÁRBOL DE COMBATE -->
        <section id="view-arena" class="view-section">
            <div class="tree-container">
                <div class="tree-level">
                    <div class="node" id="node-champion">CAMPEÓN</div>
                </div>
                <div class="tree-level">
                    <div class="node" id="node-final-1">Finalista 1</div>
                    <div class="node" id="node-final-2">Finalista 2</div>
                </div>
                <div class="tree-level">
                    <div class="node" id="node-shikamaru-match">Ganador P1</div>
                    <div class="node shikamaru" id="node-4">As</div>
                </div>
                <div class="tree-level">
                    <div class="node" id="node-0">P1 - A</div>
                    <div class="node" id="node-1">P1 - B</div>
                    <div class="node" id="node-2">P2 - A</div>
                    <div class="node" id="node-3">P2 - B</div>
                </div>
            </div>

            <div class="versus-panel" id="versusPanel">
                <div class="versus-title" id="versusTitle">Pelea 1</div>
                <div class="versus-buttons">
                    <button class="btn-fighter" id="btn-f1">Luchador 1</button>
                    <span class="vs-text">VS</span>
                    <button class="btn-fighter" id="btn-f2">Luchador 2</button>
                </div>
            </div>
        </section>

        <!-- VISTA 3: SELECCIÓN DE PREMIOS -->
        <section id="view-reward" class="view-section">
            <div class="reward-header">
                <h2 id="rewardTitle">Elija su Pokébola, Campeón</h2>
                <p>La Pokébola seleccionada será el logo oficial del siguiente torneo PVP como insignia del último campeón.</p>
            </div>
            
            <div class="pokeball-grid" id="pokeballGrid"></div>

            <div id="rewardResult" class="reward-result" style="display: none;">
                <h2>¡INSIGNIA RECLAMADA!</h2>
                <div class="trophy-container">
                    <img id="rewardImg" src="" alt="Premio">
                </div>
                <h3 id="rewardName">--</h3>
                <button id="resetBtn" class="btn-success">Reiniciar Torneo</button>
            </div>
        </section>

    </main>

    <!-- CARGA DE SCRIPTS MODULARES -->
    <script src="js/wheel.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
